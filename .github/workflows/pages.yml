name: Deploy web app to GitHub Pages

# Publishes www/ to https://jigglebox.github.io/Toddl/ so iPhones can
# install Toddl as a PWA: open in Safari -> Share -> Add to Home Screen.

on:
  push:
    # main is the home of the site; the older branch stays listed until
    # the github-pages environment allows deployments from main
    branches: ['main', 'claude/toddl-mobile-game-design-ql5au9']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # queue rather than cancel: a rejected deploy from one branch must not
  # cancel a good one from the other
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the build version
        run: bash resources/stamp-version.sh

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
